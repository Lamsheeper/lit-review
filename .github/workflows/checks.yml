name: Release checks
on:
  push:
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: src/lit_review/ui/frontend/package-lock.json
      - run: uv sync --frozen --extra dev --extra analysis
      - run: npm ci && npm test && npm run build
        working-directory: src/lit_review/ui/frontend
      - run: uv run ruff check src tests
      - run: uv run python -m unittest discover -s tests
        env:
          MPLBACKEND: Agg
      - run: uv build
      - run: uv run python scripts/verify_release.py dist
      - uses: actions/upload-artifact@v4
        with:
          name: distribution-python-${{ matrix.python }}
          path: dist/*
