[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lit-review"
version = "0.2.0"
description = "Evidence-backed literature collection, feature discovery, and taxonomy analysis."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "certifi>=2024.8.30",
    "fastapi>=0.115.0",
    "pydantic>=2.0",
    "numpy>=2.0.0",
    "pypdf>=5.0.0",
    "PyMuPDF>=1.24.0",
    "tqdm>=4.66.0",
    "uvicorn>=0.34.0",
]

[project.optional-dependencies]
analysis = ["matplotlib>=3.8.0", "scikit-learn>=1.5.0"]
dev = ["httpx>=0.28.0", "build>=1.2", "ruff>=0.11", "setuptools>=68", "wheel", "pillow>=10"]

[project.scripts]
lit-review = "lit_review.cli:main"

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
where = ["src"]
include = ["lit_review*"]
exclude = ["*.node_modules*", "*.frontend*"]

[tool.setuptools.package-data]
"lit_review.ui" = ["frontend/dist/**"]

[tool.uv]
package = true

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["F"]
